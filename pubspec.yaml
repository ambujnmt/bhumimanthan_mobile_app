name: bhumi_manthan
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  cached_network_image: ^4.0.0
  intl: ^0.20.2
  image_picker: ^1.2.3
  http: ^1.6.0
  path: ^1.9.1
  loading_animation_widget: ^1.3.0
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  geolocator: ^14.1.1
  carousel_slider: ^5.1.2
  dots_indicator: ^5.0.0
  skeletonizer: ^3.0.0
  timeago: ^3.7.1
  google_maps_flutter: ^2.18.1
  sliding_up_panel2: ^3.3.0+1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_launcher.png"
  adaptive_icon_background: "#011d4b"
  adaptive_icon_foreground: "assets/app_launcher.png"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/

  # example:
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-VariableFont_wght.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-VariableFont_wght.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
